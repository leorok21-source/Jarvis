name: Build Android APK and AAB
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Prepare official llama.cpp Android runtime
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git llama.cpp
          mkdir -p gradle
          cp llama.cpp/examples/llama.android/gradle/libs.versions.toml gradle/libs.versions.toml
          sed -i 's/-DGGML_CPU_ALL_VARIANTS=ON/-DGGML_CPU_ALL_VARIANTS=OFF/' llama.cpp/examples/llama.android/lib/build.gradle.kts
          sed -i 's/listOf("arm64-v8a", "x86_64")/listOf("arm64-v8a")/' llama.cpp/examples/llama.android/lib/build.gradle.kts
      - name: Bundle offline Russian Vosk model
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 \
            https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip \
            --output app/src/main/assets/vosk-model-small-ru-0.22.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.13113456' 'cmake;3.31.6'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK and AAB
        run: gradle --no-daemon :app:assembleDebug :app:bundleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-AAB-test-only
          path: app/build/outputs/bundle/debug/*.aab
